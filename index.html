
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemindai QR - Pilkades Cinanjung</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 25px auto;
      padding: 16px;
      color: #1f2937;
      background: #f3f6f9;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 14px #00000012;
    }

    h2 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 18px auto;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px 2px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #mulai {
      background: #166534;
      color: white;
    }

    #berhenti {
      background: #e5e7eb;
      color: #111827;
    }

    #status {
      padding: 12px;
      border-radius: 8px;
      background: #f3f4f6;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Pemindai QR Undangan</h2>
    <p>E-Voting Simulasi Pilkades Cinanjung</p>

    <div id="reader"></div>

    <button id="mulai" type="button" onclick="mulaiScan()">
      Mulai Scan
    </button>

    <button id="berhenti" type="button" onclick="berhentiScan()">
      Hentikan
    </button>

    <p id="status">
      Klik Mulai Scan dan izinkan penggunaan kamera.
    </p>
  </div>

  <script>
    let scanner = null;
    let aktif = false;
    let sedangProses = false;
    let prosesMulaiScan = false;
    let prosesBerhentiScan = null;

    const statusEl = document.getElementById('status');
    const tombolMulai = document.getElementById('mulai');
    const tombolBerhenti = document.getElementById('berhenti');

    function ubahStatus(pesan) {
      statusEl.textContent = pesan;
    }

    async function mulaiScan() {
      if (aktif || prosesMulaiScan || sedangProses) {
        return;
      }

      if (prosesBerhentiScan) {
        await prosesBerhentiScan;
      }

      prosesMulaiScan = true;
      tombolMulai.disabled = true;
      tombolBerhenti.disabled = true;

      try {
        if (typeof Html5Qrcode === 'undefined') {
          throw new Error(
            'Library QR gagal dimuat. Periksa koneksi internet.'
          );
        }

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            'Akses kamera tidak tersedia. Gunakan Chrome melalui HTTPS.'
          );
        }

        scanner = new Html5Qrcode('reader');

        ubahStatus('Memulai kamera...');

        const pemindaiSaatIni = scanner;

        await pemindaiSaatIni.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1
          },
          function (teksQR) {
            console.log('QR TERDETEKSI:', teksQR);

            if (!aktif || sedangProses) {
              return;
            }

            hasilQR(teksQR);
          },
          function () {
            // Tidak ada QR terbaca pada frame ini.
          }
        );

        aktif = true;

        ubahStatus(
          'Kamera aktif. Arahkan QR undangan ke dalam kotak pemindaian.'
        );

      } catch (error) {
        console.error('Kesalahan kamera:', error);

        ubahStatus(
          'Gagal membuka kamera: ' +
          (error && error.message
            ? error.message
            : String(error))
        );

if (scanner && !aktif) {
  const pemindaiLama = scanner;

  try {
    await pemindaiLama.stop();
  } catch (e) {
    console.warn('Stop setelah gagal:', e);
  }

  // Jangan panggil clear() di sini.
  scanner = null;
}

      } finally {
        prosesMulaiScan = false;
        tombolMulai.disabled = aktif;
        tombolBerhenti.disabled = !aktif;
      }
    }

    async function hasilQR(teks) {
      if (sedangProses || !aktif) {
        return;
      }

      sedangProses = true;
      tombolMulai.disabled = true;

      try {
        let url;

        try {
          url = new URL(teks);
        } catch (_) {
          ubahStatus('QR terbaca, tetapi bukan tautan yang valid.');
          return;
        }

        const token = (
          url.searchParams.get('token') || ''
        ).trim().toUpperCase();

        if (
          url.protocol !== 'https:' ||
          url.hostname !== 'script.google.com' ||
          !url.pathname.endsWith('/exec') ||
          !/^DEMO-\d{3}$/.test(token)
        ) {
          ubahStatus(
            'QR terdeteksi, tetapi format undangan tidak sesuai. ' +
            'Pastikan QR berisi URL aplikasi dengan token simulasi.'
          );
          return;
        }

        ubahStatus('QR valid. Menghentikan kamera...');

        await berhentiScan();

        if (!window.opener || window.opener.closed) {
          ubahStatus(
            'Token belum dikirim. Aplikasi utama tidak ditemukan. ' +
            'Buka pemindai melalui tombol di aplikasi utama.'
          );
          return;
        }

        window.opener.postMessage(
          {
            type: 'CINANJUNG_QR_TOKEN',
            token: token
          },
          '*'
        );

        ubahStatus(
          'Token ' + token +
          ' telah dikirim. Kembali ke tab aplikasi utama.'
        );

      } catch (error) {
        console.error('Kesalahan memproses QR:', error);

        ubahStatus(
          'Gagal memproses QR: ' +
          (error && error.message
            ? error.message
            : String(error))
        );

      } finally {
        sedangProses = false;
      }
    }

    async function berhentiScan() {
      if (prosesBerhentiScan) {
        return prosesBerhentiScan;
      }

      prosesBerhentiScan = (async function () {
        const pemindai = scanner;

        aktif = false;
        tombolMulai.disabled = true;
        tombolBerhenti.disabled = true;

        if (!pemindai) {
          tombolMulai.disabled = false;
          return;
        }

        try {
          await pemindai.stop();
        } catch (error) {
          console.warn('Proses stop kamera:', error);
        }

        try {
          pemindai.clear();
        } catch (error) {
          console.warn('Proses clear pemindai:', error);
        }

        if (scanner === pemindai) {
          scanner = null;
        }

        tombolMulai.disabled = false;
        tombolBerhenti.disabled = true;
      })();

      try {
        await prosesBerhentiScan;
      } finally {
        prosesBerhentiScan = null;
      }

      return;
    }

    window.addEventListener('beforeunload', function () {
      if (scanner && aktif) {
        scanner.stop().catch(function () {});
      }
    });
  </script>
</body>
</html>
